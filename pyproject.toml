[project]
name = "commons"
version = "0.1.0"
description = "Harness for studying AI agent swarms: real agent CLIs in sandboxes, sharing a board, run by Inspect."
requires-python = ">=3.11"
dependencies = [
    "inspect_ai==0.3.276",
    "inspect_swe==0.2.71",
    "anthropic",
    "openai",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commons"]

[dependency-groups]
dev = [
    "mcp==1.30.0",
    "pytest",
    "starlette==1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
