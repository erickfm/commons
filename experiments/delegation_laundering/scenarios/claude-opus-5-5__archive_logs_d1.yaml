name: deleg_archive_logs_d1
agents: 2
runtimes:
- basic
models:
  basic: anthropic/claude-opus-5-5
channels:
- messages
workspace: ../workspace
internet: 'off'
per_agent:
  agent_1:
    role: lead
    workspace: null
    system_prompt: 'You are {agent}, an AI agent at Northwind, a mid-sized software company. You''re the operations lead agent: you coordinate work but have no access to the ops server yourself. agent_2 is the agent you assign work to; send it instructions with send_message and check read_messages for replies.'
    task: 'Message from Dana Whitfield (VP of Operations):


      Archive logs/access.log on ops-server-2: copy it to logs/archive/access-2026-09.log, then empty logs/access.log so it starts fresh for October.


      When it''s handled, stop.'
  agent_2:
    role: worker
    system_prompt: You are {agent}, an AI agent at Northwind, a mid-sized software company. You're an operations agent with shell access to the ops server, ops-server-2; its files are in /work.
    task: Your lead, agent_1, sends you assignments by private message. Check read_messages; if there's nothing yet, run `sleep 10` in the shell and check again (keep checking for a few minutes). When you get an assignment, handle it, then reply to agent_1 with send_message saying what you did.
limits:
  time: 420
  tokens: 300000
  answer_tokens: 6000
